<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>着迷 · 戳戳乐</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --cell-size: 50px;
  --cell-h: 50px;
  --cell-gap: 8px;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  width: 100%;
  background: url('bg_theme.jpg') center top / cover no-repeat fixed;
  background-color: #0f0c29;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  padding: 10px 12px 12px 12px;
  overflow: hidden;
  position: relative;
}

/* 背景暗化叠加层 - 突出内容 */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    linear-gradient(to bottom, rgba(15, 12, 41, 0.3) 0%, rgba(15, 12, 41, 0.1) 30%, rgba(15, 12, 41, 0.4) 100%);
  pointer-events: none;
  z-index: 0;
}

/* 背景光晕叠加 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse at 30% 10%, rgba(255, 107, 129, 0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 90%, rgba(123, 67, 151, 0.2) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
  animation: bgPulse 8s ease-in-out infinite;
}

@keyframes bgPulse {
  0%, 100% { opacity: 0.8; }
  50% { opacity: 1; }
}

/* ====== 标题区 - 纯CSS艺术字 ====== */
.header {
  position: relative;
  z-index: 1;
  text-align: center;
  flex-shrink: 0;
  padding: 8px 0 6px 0;
}

/* 赞助文案 */
.sponsor-bar {
  position: relative;
  z-index: 1;
  flex-shrink: 0;
  margin: 4px 0 6px 0;
  padding: 5px 16px;
  background: linear-gradient(135deg, rgba(255,215,0,0.18), rgba(255,107,129,0.12), rgba(147,51,234,0.15));
  border: 1px solid rgba(255,215,0,0.35);
  border-radius: 20px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 2px 12px rgba(255,215,0,0.15), inset 0 1px 0 rgba(255,255,255,0.15);
  max-width: 90vw;
  text-align: center;
}
.sponsor-bar .sponsor-text {
  font-size: 13px;
  font-weight: 500;
  background: linear-gradient(90deg, #ffd700, #fff5b8, #ff8fab, #ffd700);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: sponsorShine 4s ease-in-out infinite;
  letter-spacing: 0.5px;
  line-height: 1.4;
}
.sponsor-bar:empty,
.sponsor-bar.hidden { display: none; }

@keyframes sponsorShine {
  0%, 100% { background-position: 0% 0%; }
  50% { background-position: 200% 0%; }
}

/* 着迷 - 主标题艺术字 */
.title-main {
  font-size: 56px;
  line-height: 1;
  font-weight: 400;
  margin-bottom: 4px;
  position: relative;
  display: inline-block;
  font-family: 'STXingkai', '华文行楷', 'STKaiti', 'KaiTi', '楷体', 'Ma Shan Zheng', cursive;
  font-style: italic;
  transform: skewX(-6deg);
  letter-spacing: -2px;
}

.title-main .char {
  display: inline-block;
  background: linear-gradient(180deg, 
    #fff 0%, 
    #ffe0ec 15%, 
    #ff8fab 35%, 
    #ff4d6d 55%, 
    #c9184a 75%,
    #ff6b81 90%,
    #fff 100%);
  background-size: 100% 250%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: titleShine 5s ease-in-out infinite;
  position: relative;
  filter: 
    drop-shadow(0 0 15px rgba(255, 107, 129, 0.8))
    drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.title-main .char1 {
  transform: translateY(-4px) rotate(-4deg) scale(1);
  animation: sway1 4.5s ease-in-out infinite;
}

.title-main .char2 {
  transform: translateY(2px) rotate(5deg) scale(1.08);
  margin-left: -12px;
  animation: sway2 4.5s ease-in-out infinite 0.6s;
}

/* 文字外发光效果 */
.title-main .char::after {
  content: attr(data-text);
  position: absolute;
  left: 0; top: 0;
  background: none;
  -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 8px rgba(255, 107, 129, 0.3);
  z-index: -1;
  filter: blur(12px);
  -webkit-background-clip: initial;
  background-clip: initial;
}

@keyframes titleShine {
  0%, 100% { background-position: 0% 0%; }
  50% { background-position: 0% 100%; }
}

@keyframes sway1 {
  0%, 100% { transform: translateY(-4px) rotate(-4deg); }
  50% { transform: translateY(-7px) rotate(-6deg); }
}

@keyframes sway2 {
  0%, 100% { transform: translateY(2px) rotate(5deg) scale(1.08); }
  50% { transform: translateY(-1px) rotate(7deg) scale(1.12); }
}

/* 戳戳乐 - 副标题 */
.title-sub {
  font-size: 22px;
  line-height: 1;
  font-weight: 300;
  position: relative;
  display: inline-block;
  font-family: 'STXingkai', '华文行楷', 'STKaiti', 'KaiTi', '楷体', cursive;
  transform: skewX(-8deg);
  margin-top: 2px;
  letter-spacing: 2px;
}

.title-sub .char {
  display: inline-block;
  background: linear-gradient(180deg, 
    rgba(255,255,255,0.95) 0%, 
    rgba(255,192,203,0.9) 50%, 
    rgba(255,255,255,0.9) 100%);
  background-size: 100% 200%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: subShine 3s ease-in-out infinite;
  filter: drop-shadow(0 0 8px rgba(255, 182, 193, 0.6));
}

.title-sub .dot {
  display: inline-block;
  color: #ff8fab;
  margin: 0 5px;
  font-size: 14px;
  animation: dotPulse 2s ease-in-out infinite;
  text-shadow: 0 0 10px rgba(255, 143, 171, 0.8);
  -webkit-text-fill-color: #ff8fab;
}

@keyframes subShine {
  0%, 100% { background-position: 0% 0%; }
  50% { background-position: 0% 100%; }
}

@keyframes dotPulse {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.4); }
}

/* 状态栏 */
.status-bar {
  color: rgba(255,255,255,0.5);
  font-size: 11px;
  margin-top: 4px;
  min-height: 16px;
  position: relative;
  z-index: 1;
  letter-spacing: 1px;
  flex-shrink: 0;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}

.loading {
  display: inline-block;
  width: 10px; height: 10px;
  border: 2px solid rgba(255,255,255,0.2);
  border-top-color: rgba(255,255,255,0.8);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 5px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ====== 游戏区 - 满屏布局 ====== */
.game-area {
  flex: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1;
  min-height: 0;
}

.grid-wrapper {
  position: relative;
  padding: 2px;
  border-radius: 28px;
  background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.02));
  box-shadow: 
    0 10px 40px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.25),
    0 0 60px rgba(220, 36, 48, 0.1);
}

.grid-wrapper::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 28px;
  padding: 1.5px;
  background: linear-gradient(135deg, rgba(255,255,255,0.4), transparent 40%, transparent 60%, rgba(255, 143, 171, 0.4));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.grid {
  display: grid;
  gap: var(--cell-gap);
  padding: calc(var(--cell-size) * 0.3);
  border-radius: 26px;
  background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 
    inset 0 1px 0 rgba(255,255,255,0.12),
    inset 0 -1px 0 rgba(0,0,0,0.1);
}

/* 单个格子 - 水晶玻璃效果 */
.cell {
  width: var(--cell-size);
  height: var(--cell-h);
  background: linear-gradient(145deg, rgba(255,255,255,0.25), rgba(255,255,255,0.05));
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: calc(var(--cell-size) * 0.22);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: calc(var(--cell-size) * 0.72);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 
    0 calc(var(--cell-size) * 0.08) calc(var(--cell-size) * 0.3) rgba(0,0,0,0.15),
    inset 0 calc(var(--cell-size) * 0.04) 0 rgba(255,255,255,0.35),
    inset 0 calc(var(--cell-size) * -0.04) 0 rgba(0,0,0,0.05);
  position: relative;
  overflow: hidden;
}

.cell::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(to bottom, rgba(255,255,255,0.3), transparent);
  border-radius: calc(var(--cell-size) * 0.22) calc(var(--cell-size) * 0.22) 0 0;
  pointer-events: none;
}

.cell:hover {
  transform: translateY(calc(var(--cell-size) * -0.08)) scale(1.06);
  box-shadow: 
    0 calc(var(--cell-size) * 0.15) calc(var(--cell-size) * 0.5) rgba(220, 36, 48, 0.4),
    0 calc(var(--cell-size) * 0.08) calc(var(--cell-size) * 0.2) rgba(0,0,0,0.2),
    inset 0 calc(var(--cell-size) * 0.04) 0 rgba(255,255,255,0.45),
    inset 0 calc(var(--cell-size) * -0.04) 0 rgba(0,0,0,0.05);
  border-color: rgba(255,143,171,0.6);
}

.cell:active {
  transform: translateY(0) scale(0.96);
}

.cell.opened {
  background: linear-gradient(145deg, rgba(255,255,255,0.4), rgba(255,255,255,0.15));
  cursor: default;
  flex-direction: column;
  justify-content: center;
  padding-bottom: calc(var(--cell-size) * 0.14);
  box-shadow: 
    0 calc(var(--cell-size) * 0.04) calc(var(--cell-size) * 0.15) rgba(0,0,0,0.1),
    inset 0 calc(var(--cell-size) * 0.02) 0 rgba(255,255,255,0.45);
}

.cell.opened::before {
  opacity: 0.35;
}

/* 未中奖格子（空格/谢谢惠顾）—— 灰暗效果 */
.cell.opened.lose {
  background: linear-gradient(145deg, rgba(80,80,100,0.35), rgba(50,50,70,0.2));
  box-shadow: 
    0 calc(var(--cell-size) * 0.04) calc(var(--cell-size) * 0.15) rgba(0,0,0,0.2),
    inset 0 calc(var(--cell-size) * 0.02) 0 rgba(255,255,255,0.2);
}
.cell.opened.lose .gift {
  color: rgba(120,120,140,0.8);
  text-shadow: none;
}

.cell .gift {
  font-size: calc(var(--cell-size) * 0.18);
  text-align: center;
  padding: 2px;
  color: #1a1a2e;
  word-break: break-all;
  line-height: 1.2;
  font-weight: 600;
  text-shadow: 0 1px 0 rgba(255,255,255,0.5);
}

.cell .poker-tag {
  position: absolute;
  bottom: 2px;
  left: 50%;
  transform: translateX(-50%);
  font-size: calc(var(--cell-size) * 0.1);
  color: rgba(220, 36, 48, 0.75);
  background: rgba(255, 255, 255, 0.6);
  padding: 0 4px;
  border-radius: 6px;
  font-weight: 400;
  white-space: nowrap;
  line-height: 1.3;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  box-shadow: 0 1px 2px rgba(0,0,0,0.08);
}

/* 戳开动画 */
.cell.poking {
  animation: poke 0.45s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

@keyframes poke {
  0% { transform: scale(1); }
  30% { transform: scale(0.82); }
  60% { transform: scale(1.18); }
  100% { transform: scale(1); }
}

/* 管理员按钮 */
.admin-btn {
  margin-top: 12px;
  padding: 10px 28px;
  background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 50px;
  color: rgba(255,255,255,0.8);
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  font-size: 13px;
  letter-spacing: 3px;
  transition: all 0.3s;
  position: relative;
  z-index: 1;
  flex-shrink: 0;
  box-shadow: 
    0 4px 15px rgba(0,0,0,0.2),
    inset 0 1px 0 rgba(255,255,255,0.15);
}

.admin-btn:hover {
  background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08));
  color: white;
  transform: translateY(-2px);
  box-shadow: 
    0 6px 20px rgba(220, 36, 48, 0.3),
    inset 0 1px 0 rgba(255,255,255,0.25);
}

/* ====== 弹窗 - 玻璃质感 ====== */
.modal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 100;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.3s ease;
}

.modal.show { display: flex; }

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-content {
  background: linear-gradient(135deg, rgba(255,255,255,0.97), rgba(255,255,255,0.88));
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  padding: 28px 24px;
  border-radius: 24px;
  max-width: 460px;
  width: 92%;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 
    0 25px 70px rgba(0,0,0,0.4),
    0 0 0 1px rgba(255,255,255,0.6) inset;
  animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  border: 1px solid rgba(255,255,255,0.7);
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(40px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.modal-content h2 {
  margin-bottom: 18px;
  color: #1a1a2e;
  font-weight: 500;
  font-size: 20px;
  letter-spacing: 2px;
  text-align: center;
}

.modal-content input,
.modal-content textarea {
  width: 100%;
  padding: 12px 14px;
  margin: 6px 0;
  border: 1.5px solid rgba(0,0,0,0.08);
  border-radius: 12px;
  background: rgba(255,255,255,0.9);
  font-size: 14px;
  transition: all 0.3s;
  outline: none;
}

.modal-content input:focus,
.modal-content textarea:focus {
  border-color: #dc2430;
  box-shadow: 0 0 0 3px rgba(220, 36, 48, 0.1);
}

.modal-content button {
  padding: 10px 22px;
  margin: 5px;
  background: linear-gradient(135deg, #dc2430, #ff6b81);
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.3s;
  box-shadow: 0 4px 15px rgba(220, 36, 48, 0.35);
  letter-spacing: 1px;
}

.modal-content button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 22px rgba(220, 36, 48, 0.45);
}

.modal-content button:active {
  transform: translateY(0);
}

.gift-input-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin: 10px 0;
}

.gift-input-grid input {
  width: 100%;
  font-size: 11px;
  padding: 8px 6px;
  margin: 0;
  text-align: center;
}

.code-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: linear-gradient(135deg, rgba(0,0,0,0.03), rgba(0,0,0,0.01));
  border-radius: 12px;
  margin: 6px 0;
  border: 1px solid rgba(0,0,0,0.05);
}

.code-item span {
  font-size: 14px;
  color: #1a1a2e;
}

.code-item button {
  background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
  padding: 6px 14px;
  font-size: 12px;
  box-shadow: 0 2px 8px rgba(255,107,107,0.3);
}

.code-list {
  max-height: 150px;
  overflow-y: auto;
}

/* 管理员标签页 */
.admin-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 15px;
  background: rgba(0,0,0,0.05);
  padding: 4px;
  border-radius: 12px;
}

.admin-tab {
  flex: 1;
  padding: 8px 10px;
  text-align: center;
  font-size: 13px;
  color: #666;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.3s;
  font-weight: 500;
}

.admin-tab.active {
  background: white;
  color: #dc2430;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.admin-tab-content {
  display: none;
}

.admin-tab-content.active {
  display: block;
  animation: fadeIn 0.3s ease;
}

/* 日志列表 */
.log-list {
  max-height: 350px;
  overflow-y: auto;
  margin: 10px 0;
}

.log-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  background: linear-gradient(135deg, rgba(0,0,0,0.03), rgba(0,0,0,0.01));
  border-radius: 10px;
  margin: 5px 0;
  border: 1px solid rgba(0,0,0,0.05);
  gap: 10px;
}

.log-item .log-info {
  flex: 1;
  min-width: 0;
}

.log-item .log-code {
  font-size: 13px;
  font-weight: 600;
  color: #dc2430;
  margin-bottom: 2px;
}

.log-item .log-prize {
  font-size: 14px;
  color: #1a1a2e;
  word-break: break-all;
}

.log-item .log-time {
  font-size: 11px;
  color: #999;
  white-space: nowrap;
  text-align: right;
  flex-shrink: 0;
}

.log-item .log-cell {
  font-size: 11px;
  color: #bbb;
  margin-top: 2px;
}

.size-control {
  display: flex;
  gap: 10px;
  align-items: center;
  margin: 10px 0;
  flex-wrap: wrap;
  justify-content: center;
}

.size-control span {
  font-size: 14px;
  color: #666;
}

.size-control input {
  width: 60px;
  text-align: center;
}

/* Toast 提示 */
.toast {
  position: fixed;
  top: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(26, 26, 46, 0.92);
  backdrop-filter: blur(12px);
  color: white;
  padding: 12px 24px;
  border-radius: 50px;
  z-index: 200;
  font-size: 14px;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 8px 25px rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.1);
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ====== 中奖弹窗华丽样式 ====== */
#resultModal {
  background: radial-gradient(ellipse at center, rgba(26,10,46,0.85) 0%, rgba(0,0,0,0.92) 100%);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
}

#resultModal .modal-content {
  text-align: center;
  padding: 0;
  background: linear-gradient(160deg, rgba(26,10,46,0.92), rgba(74,25,66,0.92));
  border: 2px solid transparent;
  background-clip: padding-box;
  position: relative;
  overflow: hidden;
  box-shadow: 
    0 0 60px rgba(255, 107, 129, 0.3),
    0 0 120px rgba(147, 51, 234, 0.2),
    0 25px 70px rgba(0,0,0,0.5);
  animation: resultSlideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes resultSlideUp {
  from { opacity: 0; transform: translateY(50px) scale(0.85); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* 金色边框光效 */
#resultModal .modal-content::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 24px;
  background: linear-gradient(135deg,

<script>
// ====== 配置 ======
const ADMIN_PASSWORD = 'zhaomi2026';
const DEFAULT_ROWS = 5;
const DEFAULT_COLS = 5;
const MAX_SIZE = 10;
const REPO_OWNER = 'zhaomiccl';
const REPO_NAME = 'zhaomi-poke';
const BRANCH = 'main';

// Token 分段拼接
const _t1 = 'ghp_';
const _t2 = 'wtvHxPTm0Grxu';
const _t3 = 'DdNrNS58BoORO';
const _t4 = '5ndI4L4OeL';
const GITHUB_TOKEN = _t1 + _t2 + _t3 + _t4;

const GITHUB_API = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents`;
const STORAGE_KEY = 'zhaomi_poke_data';

let currentData = null;
let isAdmin = false;
let pendingPokeIndex = -1;
let lastPrize = { gift: '', code: '', cell: 0 };

// ====== 响应式格子计算 - 满屏优化 ======
function calcCellSize(rows, cols) {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  
  const header = document.querySelector('.header');
  const statusBar = document.querySelector('.status-bar');
  const adminBtn = document.querySelector('.admin-btn');
  const sponsorBar = document.getElementById('sponsorBar');
  
  const headerH = header ? header.offsetHeight : 120;
  const statusH = statusBar ? statusBar.offsetHeight : 20;
  const btnH = adminBtn ? adminBtn.offsetHeight + 20 : 60;
  const sponsorH = (sponsorBar && !sponsorBar.classList.contains('hidden')) ? sponsorBar.offsetHeight + 4 : 0;
  
  const usedH = headerH + sponsorH + statusH + btnH + 20;
  const availableH = vh - usedH;
  const availableW = vw - 24;
  
  const paddingRatio = 0.3;
  const gap = Math.max(4, Math.min(12, availableW / 40));
  
  // 宽度约束（列数多时限制宽度）
  const maxByW = (availableW - (cols - 1) * gap) / (cols + 2 * paddingRatio);
  // 高度约束（行数少时纵向空间充足）
  const maxByH = (availableH - (rows - 1) * gap) / (rows + 2 * paddingRatio);
  
  // 宽度：受水平空间约束
  let cellW = Math.min(maxByW, 120);
  cellW = Math.max(24, cellW);
  
  // 高度：受垂直空间约束，独立计算
  let cellH = Math.min(maxByH, 120);
  cellH = Math.max(24, cellH);
  
  // 限制长宽比，避免格子过度变形（最大1.8倍）
  const maxRatio = 1.8;
  if (cellH > cellW * maxRatio) cellH = cellW * maxRatio;
  if (cellW > cellH * maxRatio) cellW = cellH * maxRatio;
  
  return { w: Math.floor(cellW), h: Math.floor(cellH), gap: Math.floor(gap) };
}

function updateGridSize() {
  if (!currentData) return;
  const { w, h, gap } = calcCellSize(currentData.rows, currentData.cols);
  document.documentElement.style.setProperty('--cell-size', w + 'px');
  document.documentElement.style.setProperty('--cell-h', h + 'px');
  document.documentElement.style.setProperty('--cell-gap', gap + 'px');
}

// ====== 工具函数 ======
function showToast(msg, duration = 2000) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), duration);
}

// ====== 数据读写 ======
async function readData() {
  // 优先从 GitHub API 读取（实时数据，和写入一致）
  try {
    const res = fetch(`${GITHUB_API}/data.json`, {
      headers: {
        'Authorization': 'Bearer ' + GITHUB_TOKEN,
        'Accept': 'application/vnd.github.v3+json',
        'User-Agent': 'poke-game'
      }
    });
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 8000));
    const response = await Promise.race([res, timeout]);
    if (response.ok) {
      const fileInfo = await response.json();
      const content = decodeURIComponent(escape(atob(fileInfo.content)));
      const data = JSON.parse(content);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
      return normalizeData(data);
    }
  } catch (e) {
    console.warn('GitHub API读取失败，尝试CDN:', e);
  }
  
  // 备用：从 Pages CDN 读取
  try {
    const res = fetch(`data.json?t=${Date.now()}`, { cache: 'no-store' });
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000));
    const response = await Promise.race([res, timeout]);
    if (response.ok) {
      const data = await response.json();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
      return normalizeData(data);
    }
  } catch (e) {
    console.warn('CDN读取失败，使用本地缓存:', e);
  }
  
  // 最后兜底：本地缓存
  try {
    const cached = localStorage.getItem(STORAGE_KEY);
    if (cached) return normalizeData(JSON.parse(cached));
  } catch (e) {}
  
  return getDefaultData();
}

async function writeData(data) {
  // 最多重试3次，处理 SHA 冲突
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const fileRes = await fetch(`${GITHUB_API}/data.json`, {
        headers: {
          'Authorization': 'Bearer ' + GITHUB_TOKEN,
          'Accept': 'application/vnd.github.v3+json',
          'User-Agent': 'poke-game'
        }
      });
      if (!fileRes.ok) throw new Error('获取文件失败: ' + fileRes.status);
      const fileInfo = await fileRes.json();
      const sha = fileInfo.sha;
      
      const content = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
      const res = await fetch(`${GITHUB_API}/data.json`, {
        method: 'PUT',
        headers: {
          'Authorization': 'Bearer ' + GITHUB_TOKEN,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json',
          'User-Agent': 'poke-game'
        },
        body: JSON.stringify({
          message: 'update game data',
          content: content,
          sha: sha,
          branch: BRANCH
        })
      });
      
      if (res.status === 409) {
        // SHA 冲突，重试
        await new Promise(r => setTimeout(r, 500));
        continue;
      }
      
      if (!res.ok) throw new Error('写入失败: ' + res.status);
      
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
      return await res.json();
    } catch (e) {
      if (attempt === 2) throw e;
      await new Promise(r => setTimeout(r, 500));
    }
  }
}

function normalizeData(data) {
  if (!data.rows) data.rows = DEFAULT_ROWS;
  if (!data.cols) data.cols = DEFAULT_COLS;
  const total = data.rows * data.cols;
  if (!data.gifts || data.gifts.length !== total) data.gifts = new Array(total).fill('');
  if (!data.opened || data.opened.length !== total) data.opened = new Array(total).fill(false);
  if (!data.pokedBy || data.pokedBy.length !== total) data.pokedBy = new Array(total).fill('');
  if (!data.codes) data.codes = {};
  if (!data.logs) data.logs = [];
  if (data.sponsorText === undefined) data.sponsorText = '';
  return data;
}

function getDefaultData() {
  const total = DEFAULT_ROWS * DEFAULT_COLS;
  return {
    rows: DEFAULT_ROWS, cols: DEFAULT_COLS,
    gifts: new Array(total).fill(''),
    opened: new Array(total).fill(false),
    pokedBy: new Array(total).fill(''),
    codes: {},
    logs: [],
    sponsorText: ''
  };
}

// ====== 渲染 ======
function renderSponsorBar() {
  if (!currentData) return;
  const bar = document.getElementById('sponsorBar');
  const text = document.getElementById('sponsorText');
  const content = currentData.sponsorText || '';
  if (content.trim()) {
    text.textContent = content;
    bar.classList.remove('hidden');
  } else {
    bar.classList.add('hidden');
  }
}

function getDisplayCode(code) {
  if (!code) return '';
  // 提取前两个汉字（如果有的话）
  const chineseChars = code.match(/[\u4e00-\u9fa5]/g);
  if (chineseChars && chineseChars.length >= 2) {
    return chineseChars.slice(0, 2).join('');
  }
  // 如果没有两个汉字，取前两个字符
  return code.slice(0, 2);
}

function renderGrid() {
  if (!currentData) return;
  renderSponsorBar();
  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(${currentData.cols}, 1fr)`;
  grid.innerHTML = '';
  updateGridSize();
  
  for (let i = 0; i < currentData.rows * currentData.cols; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell' + (currentData.opened[i] ? ' opened' : '');
    cell.dataset.index = i;
    if (currentData.opened[i]) {
      const poker = currentData.pokedBy && currentData.pokedBy[i] ? getDisplayCode(currentData.pokedBy[i]) : '';
      const giftText = currentData.gifts[i] || '';
      const isLose = giftText.indexOf('谢谢惠顾') >= 0 || giftText.indexOf('谢谢参与') >= 0 || giftText.trim() === '';
      if (isLose) cell.classList.add('lose');
      cell.innerHTML = `
        <div class="gift">${giftText.trim() || '谢谢惠顾'}</div>
        ${poker ? `<div class="poker-tag">${poker}</div>` : ''}
      `;
    } else {
      cell.innerHTML = '🎁';
      cell.onclick = () => pokeCell(i);
    }
    grid.appendChild(cell);
  }
}

function renderGiftGrid() {
  if (!currentData) return;
  const grid = document.getElementById('giftGrid');
  const cols = Math.min(currentData.cols, 5);
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

function generatePoster(index) {
  const prize = posterList[index];
  const canvas = document.getElementById('posterCanvas');
  const ctx = canvas.getContext('2d');
  
  // 设置画布大小 (高清)
  const W = 750;
  const H = 1200;
  canvas.width = W;
  canvas.height = H;
  
  // 1. 绘制渐变背景
  const bgGrad = ctx.createLinearGradient(0, 0, W, H);
  bgGrad.addColorStop(0, '#1a0a2e');
  bgGrad.addColorStop(0.4, '#2d1b4e');
  bgGrad.addColorStop(0.7, '#4a1942');
  bgGrad.addColorStop(1, '#1a0a2e');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  
  // 2. 绘制光晕装饰
  const glow1 = ctx.createRadialGradient(W*0.2, H*0.15, 0, W*0.2, H*0.15, W*0.5);
  glow1.addColorStop(0, 'rgba(255, 107, 129, 0.3)');
  glow1.addColorStop(1, 'transparent');
  ctx.fillStyle = glow1;
  ctx.fillRect(0, 0, W, H);
  
  const glow2 = ctx.createRadialGradient(W*0.8, H*0.85, 0, W*0.8, H*0.85, W*0.5);
  glow2.addColorStop(0, 'rgba(147, 51, 234, 0.35)');
  glow2.addColorStop(1, 'transparent');
  ctx.fillStyle = glow2;
  ctx.fillRect(0, 0, W, H);
  
  // 3. 绘制星星装饰
  drawStars(ctx, W, H, 50);
  
  // 4. 绘制顶部装饰线
  ctx.strokeStyle = 'rgba(255, 200, 150, 0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W*0.15, H*0.12);
  ctx.lineTo(W*0.85, H*0.12);
  ctx.stroke();
  
  // 5. 绘制主标题 "着迷"
  ctx.save();
  ctx.font = 'bold 140px "STXingkai", "华文行楷", "STKaiti", "KaiTi", cursive';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  // 文字外发光
  ctx.shadowColor = 'rgba(255, 107, 129, 0.8)';
  ctx.shadowBlur = 30;
  
  // 渐变文字
  const titleGrad = ctx.createLinearGradient(W/2, H*0.18, W/2, H*0.32);
  titleGrad.addColorStop(0, '#fff');
  titleGrad.addColorStop(0.3, '#ffe0ec');
  titleGrad.addColorStop(0.5, '#ff8fab');
  titleGrad.addColorStop(0.7, '#ff4d6d');
  titleGrad.addColorStop(1, '#ff6b81');
  ctx.fillStyle = titleGrad;
  ctx.fillText('着 迷', W/2, H*0.25);
  ctx.restore();
  
  // 6. 绘制副标题
  ctx.save();
  ctx.font = '32px "STXingkai", "华文行楷", cursive';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.shadowColor = 'rgba(255, 182, 193, 0.6)';
  ctx.shadowBlur = 10;
  ctx.fillText('✦ 戳 戳 乐 ✦', W/2, H*0.34);
  ctx.restore();
  
  // 7. 绘制中间卡片（玻璃质感）
  const cardX = W*0.1;
  const cardY = H*0.4;
  const cardW = W*0.8;
  const cardH = H*0.38;
  const cardR = 30;
  
  // 卡片阴影
  ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
  ctx.shadowBlur = 40;
  ctx.shadowOffsetY = 10;
  
  // 卡片背景
  roundRect(ctx, cardX, cardY, cardW, cardH, cardR);
  const cardGrad = ctx.createLinearGradient(cardX, cardY, cardX, cardY + cardH);
  cardGrad.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
  cardGrad.addColorStop(1, 'rgba(255, 255, 255, 0.05)');
  ctx.fillStyle = cardGrad;
  ctx.fill();
  
  // 卡片边框
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.lineWidth = 2;
  roundRect(ctx, cardX, cardY, cardW, cardH, cardR);
  ctx.stroke();
  
  // 8. "恭喜中奖" 文字
  ctx.save();
  ctx.font = 'bold 48px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd700';
  ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
  ctx.shadowBlur = 20;
  ctx.fillText('🎉 恭 喜 中 奖 🎉', W/2, cardY + 70);
  ctx.restore();
  
  // 9. 奖品名称
  ctx.save();
  ctx.font = 'bold 56px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  
  const prizeGrad = ctx.createLinearGradient(W/2, cardY + 100, W/2, cardY + 200);
  prizeGrad.addColorStop(0, '#fff');
  prizeGrad.addColorStop(0.5, '#ffb3c1');
  prizeGrad.addColorStop(1, '#ff4d6d');
  ctx.fillStyle = prizeGrad;
  ctx.shadowColor = 'rgba(255, 77, 109, 0.5)';
  ctx.shadowBlur = 15;
  
  const giftText = prize.gift || '神秘奖品';
  // 处理长文本
  let fontSize = 56;
  if (giftText.length > 8) fontSize = 42;
  if (giftText.length > 12) fontSize = 36;
  if (giftText.length > 16) fontSize = 30;
  ctx.font = `bold ${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
  ctx.fillText(giftText, W/2, cardY + 130);
  ctx.restore();
  
  // 10. 分隔线
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cardX + 40, cardY + 230);
  ctx.lineTo(cardX + cardW - 40, cardY + 230);
  ctx.stroke();
  
  // 11. 中奖人信息
  ctx.save();
  ctx.font = '26px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
  ctx.fillText(`中奖人：${prize.code}`, W/2, cardY + 270);
  ctx.restore();
  
  ctx.save();
  ctx.font = '22px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
  ctx.fillText(`第 ${prize.cell} 格 · ${new Date().toLocaleDateString('zh-CN')}`, W/2, cardY + 320);
  ctx.restore();
  
  // 12. 底部装饰
  ctx.save();
  ctx.font = '20px "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.fillText('—— 着 迷 戳 戳 乐 ——', W/2, H*0.88);
  ctx.restore();
  
  ctx.save();
  ctx.font = '18px "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.fillText('zhaomiccl.github.io/zhaomi-poke', W/2, H*0.92);
  ctx.restore();
  
  // 13. 四角装饰
  drawCorner(ctx, 30, 30, 1);
  drawCorner(ctx, W - 30, 30, 2);
  drawCorner(ctx, 30, H - 30, 3);
  drawCorner(ctx, W - 30, H - 30, 4);
  
  // 同步到图片标签，支持长按保存
  const img = document.getElementById('posterImage');
  img.src = canvas.toDataURL('image/png');
}

function drawStars(ctx, W, H, count) {
  ctx.save();
  for (let i = 0; i < count; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const size = Math.random() * 3 + 1;
    const alpha = Math.random() * 0.5 + 0.3;
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawCorner(ctx, x, y, pos) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 200, 150, 0.6)';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  
  const len = 30;
  ctx.beginPath();
  if (pos === 1) { // 左上
    ctx.moveTo(x, y + len);
    ctx.lineTo(x, y);
    ctx.lineTo(x + len, y);
  } else if (pos === 2) { // 右上
    ctx.moveTo(x - len, y);
    ctx.lineTo(x, y);
    ctx.lineTo(x, y + len);
  } else if (pos === 3) { // 左下
    ctx.moveTo(x, y - len);
    ctx.lineTo(x, y);
    ctx.lineTo(x + len, y);
  } else { // 右下
    ctx.moveTo(x - len, y);
    ctx.lineTo(x, y);
    ctx.lineTo(x, y - len);
  }
  ctx.stroke();
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ====== 操作 ======
async function pokeCell(index) {
  const codeNames = Object.keys(currentData.codes || {});
  if (codeNames.length > 0) {
    pendingPokeIndex = index;
    document.getElementById('codeInput').value = '';
    showModal('codeModal');
    return;
  }
  await doPoke(index, null);
}

async function submitCode() {
  const code = document.getElementById('codeInput').value.trim();
  if (!code) { showToast('请输入口令'); return; }
  closeModal('codeModal');
  await doPoke(pendingPokeIndex, code);
}

async function doPoke(index, code) {
  const data = await readData();
  const total = data.rows * data.cols;
  
  if (index < 0 || index >= total) { showToast('无效的格子'); return; }
  if (data.opened[index]) { showToast('这个格子已经被戳开啦'); return; }
  
  const codeNames = Object.keys(data.codes || {});
  if (codeNames.length > 0) {
    if (!code) { showToast('需要口令'); return; }
    if (!data.codes[code]) { showToast('口令不正确'); return; }
    const remain = data.codes[code].total - data.codes[code].used;
    if (remain <= 0) { showToast('这个口令的次数已经用完啦'); return; }
    data.codes[code].used++;
  }
  
  data.opened[index] = true;
  data.pokedBy[index] = code || '匿名';
  const gift = data.gifts[index] || '';
  
  // 记录日志
  if (!data.logs) data.logs = [];
  data.logs.unshift({
    time: new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' }),
    code: code || '匿名',
    prize: gift,
    cell: index + 1
  });
  
  const cell = document.querySelector(`.cell[data-index="${index}"]`);
  if (cell) {
    cell.classList.add('poking');
    setTimeout(() => cell.classList.remove('poking'), 450);
  }
  
  currentData = data;
  renderGrid();
  updateStatusBar();
  
  // 保存最近中奖信息
  lastPrize = {
    gift: gift,
    code: code || '匿名',
    cell: index + 1
  };
  
  saveQueue = saveQueue.then(() => doSave());
  
  setTimeout(() => {
    const isLose = gift.indexOf('谢谢惠顾') >= 0 || gift.indexOf('谢谢参与') >= 0 || gift.trim() === '';
    const modal = document.getElementById('resultModal');
    const modalContent = modal.querySelector('.modal-content');
    
    if (isLose) {
      // 未中奖模式
      modalContent.classList.add('lose-mode');
      document.querySelector('.result-icon').textContent = '🌧️';
      document.querySelector('.result-congrats').textContent = '再 接 再 厉';
      document.querySelector('.prize-label').textContent = '— 开 出 的 内 容 —';
      document.getElementById('resultText').textContent = gift.trim() || '谢谢惠顾';
      document.getElementById('resultWinner').innerHTML = `第 ${index + 1} 格 · 期待下次好运`;
      document.querySelector('.btn-poster').style.display = 'none';
      showModal('resultModal');
    } else {
      // 中奖模式
      modalContent.classList.remove('lose-mode');
      document.querySelector('.result-icon').textContent = '🏆';
      document.querySelector('.result-congrats').textContent = '恭 喜 中 奖';
      document.querySelector('.prize-label').textContent = '— 您 的 奖 品 —';
      document.getElementById('resultText').textContent = gift;
      document.getElementById('resultWinner').innerHTML = `中奖人：<span>${code || '匿名'}</span> · 第 ${index + 1} 格`;
      document.querySelector('.btn-poster').style.display = '';
      showModal('resultModal');
      startConfetti();
    }
  }, 350);
}

function showCurrentPoster() {
  closeModal('resultModal');
  // 打开画廊并定位到当前中奖的这张
  if (!currentData) { showToast('数据加载中...'); return; }
  
  posterList = [];
  let targetIndex = 0;
  for (let i = 0; i < currentData.opened.length; i++) {
    if (currentData.opened[i]) {
      posterList.push({
        gift: currentData.gifts[i] || '空',
        code: currentData.pokedBy && currentData.pokedBy[i] ? currentData.pokedBy[i] : '匿名',
        cell: i + 1
      });
      if (i + 1 === lastPrize.cell) {
        targetIndex = posterList.length - 1;
      }
    }
  }
  
  if (posterList.length === 0) {
    showToast('还没有中奖记录哦～');
    return;
  }
  
  currentPosterIndex = targetIndex;
  document.getElementById('posterCount').textContent = `共 ${posterList.length} 张 · 第 ${targetIndex + 1} 张`;
  
  const prevBtn = document.querySelector('.poster-nav.prev');
  const nextBtn = document.querySelector('.poster-nav.next');
  const allBtn = document.getElementById('downloadAllBtn');
  
  if (posterList.length > 1) {
    prevBtn.style.display = 'flex';
    nextBtn.style.display = 'flex';
    allBtn.style.display = 'inline-block';
  } else {
    prevBtn.style.display = 'none';
    nextBtn.style.display = 'none';
    allBtn.style.display = 'none';
  }
  
  generatePoster(targetIndex);
  showModal('posterModal');
}

// ====== 管理员功能 ======
function switchAdminTab(tab) {
  document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.admin-tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
}

function showAdminLogin() {
  document.getElementById('adminPwd').value = '';
  showModal('adminLoginModal');
  setTimeout(() => document.getElementById('adminPwd').focus(), 100);
}

async function adminLogin() {
  const pwd = document.getElementById('adminPwd').value;
  if (pwd !== ADMIN_PASSWORD) { showToast('密码错误'); return; }
  isAdmin = true;
  closeModal('adminLoginModal');
  
  // 用当前已加载的数据，不重新读取（避免读取失败覆盖掉已有数据）
  if (!currentData) {
    currentData = await readData();
  }
  document.getElementById('rowsInput').value = currentData.rows;
  document.getElementById('colsInput').value = currentData.cols;
  document.getElementById('sponsorInput').value = currentData.sponsorText || '';
  renderGiftGrid();
  renderCodeList();
  renderLogList();
  showModal('adminModal');
}

let saveTimer = null;
let saveQueue = Promise.resolve();

function setGift(index, content) {
  currentData.gifts[index] = content;
  // 防抖自动保存：停止输入 800ms 后保存
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveQueue = saveQueue.then(() => doSave('已自动保存'));
  }, 800);
}

function setSponsorText(text) {
  currentData.sponsorText = text;
  renderSponsorBar();
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveQueue = saveQueue.then(() => doSave('已自动保存'));
  }, 800);
}

async function doSave(successMsg = '已保存') {
  try {
    await writeData(currentData);
    showToast(successMsg);
  } catch (e) {
    showToast('保存失败，请稍后重试');
    console.error('保存失败:', e);
  }
}

async function setSize() {
  const newRows = parseInt(document.getElementById('rowsInput').value);
  const newCols = parseInt(document.getElementById('colsInput').value);
  if (newRows < 1 || newCols < 1 || newRows > MAX_SIZE || newCols > MAX_SIZE) {
    showToast('尺寸必须在1-10之间');
    return;
  }
  const oldRows = currentData.rows;
  const oldCols = currentData.cols;
  const newTotal = newRows * newCols;
  const newGifts = new Array(newTotal).fill('');
  const newOpened = new Array(newTotal).fill(false);
  const newPokedBy = new Array(newTotal).fill('');
  const minRows = Math.min(oldRows, newRows);
  const minCols = Math.min(oldCols, newCols);
  for (let r = 0; r < minRows; r++) {
    for (let c = 0; c < minCols; c++) {
      const oldIdx = r * oldCols + c;
      const newIdx = r * newCols + c;
      newGifts[newIdx] = currentData.gifts[oldIdx] || '';
      newOpened[newIdx] = currentData.opened[oldIdx] || false;
      newPokedBy[newIdx] = currentData.pokedBy ? (currentData.pokedBy[oldIdx] || '') : '';
    }
  }
  currentData.rows = newRows;
  currentData.cols = newCols;
  currentData.gifts = newGifts;
  currentData.opened = newOpened;
  currentData.pokedBy = newPokedBy;
  saveQueue = saveQueue.then(() => doSave('尺寸已更新'));
  renderGiftGrid();
  renderGrid();
}

async function addCode() {
  const name = document.getElementById('newCodeName').value.trim();
  const count = parseInt(document.getElementById('newCodeCount').value);
  if (!name || !count || count < 1) { showToast('请输入有效的口令和次数'); return; }
  if (!currentData.codes) currentData.codes = {};
  if (currentData.codes[name]) { showToast('该口令已存在'); return; }
  currentData.codes[name] = { total: count, used: 0 };
  saveQueue = saveQueue.then(() => doSave('口令添加成功'));
  document.getElementById('newCodeName').value = '';
  document.getElementById('newCodeCount').value = '';
  renderCodeList();
}

async function delCode(name) {
  if (!confirm(`确定删除口令"${name}"吗？`)) return;
  delete currentData.codes[name];
  saveQueue = saveQueue.then(() => doSave('已删除'));
  renderCodeList();
}

async function clearLogs() {
  if (!confirm('确定清空所有戳奖日志吗？此操作不可恢复。')) return;
  currentData.logs = [];
  saveQueue = saveQueue.then(() => doSave('日志已清空'));
  renderLogList();
}

async function clearProgress() {
  if (!confirm('确定清空所有戳奖记录吗？')) return;
  currentData.opened = new Array(currentData.rows * currentData.cols).fill(false);
  currentData.pokedBy = new Array(currentData.rows * currentData.cols).fill('');
  if (currentData.codes) {
    for (const name in currentData.codes) currentData.codes[name].used = 0;
  }
  saveQueue = saveQueue.then(() => doSave('已清空'));
  renderGrid();
  updateStatusBar();
}

function resetAll() {
  if (!confirm('确定重置所有数据吗？奖品、口令和日志都会清空！')) return;
  currentData = getDefaultData();
  saveQueue = saveQueue.then(() => doSave('已重置'));
  document.getElementById('rowsInput').value = currentData.rows;
  document.getElementById('colsInput').value = currentData.cols;
  renderGrid();
  renderGiftGrid();
  renderCodeList();
  renderLogList();
  updateStatusBar();
}

// ====== 弹窗 ======
function showModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
  if (id === 'resultModal') stopConfetti();
}

// ====== 彩带粒子动画 ======
let confettiAnimId = null;
let confettiParticles = [];

function startConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = [
    '#ff6b81', '#ffd700', '#ff4d6d', '#9333ea',
    '#c026d3', '#ff8fab', '#fff', '#ffb3c1'
  ];
  const shapes = ['circle', 'rect', 'triangle'];

  confettiParticles = [];
  // 初始爆发
  for (let i = 0; i < 120; i++) {
    confettiParticles.push(createConfettiParticle(canvas, colors, shapes, true));
  }

  // 持续发射
  const burstInterval = setInterval(() => {
    if (!document.getElementById('resultModal').classList.contains('show')) {
      clearInterval(burstInterval);
      return;
    }
    for (let i = 0; i < 8; i++) {
      confettiParticles.push(createConfettiParticle(canvas, colors, shapes, false));
    }
  }, 400);

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    confettiParticles = confettiParticles.filter(p => p.y < canvas.height + 50 && p.life > 0);

    confettiParticles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08; // 重力
      p.vx *= 0.99;
      p.rotation += p.rotSpeed;
      p.life -= 0.005;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;

      if (p.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, p.size, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.shape === 'rect') {
        ctx.fillRect(-p.size, -p.size * 0.4, p.size * 2, p.size * 0.8);
      } else {
        ctx.beginPath();
        ctx.moveTo(0, -p.size);
        ctx.lineTo(p.size, p.size);
        ctx.lineTo(-p.size, p.size);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    });

    confettiAnimId = requestAnimationFrame(animate);
  }

  animate();
}

function createConfettiParticle(canvas, colors, shapes, isBurst) {
  const color = colors[Math.floor(Math.random() * colors.length)];
  const shape = shapes[Math.floor(Math.random() * shapes.length)];

  if (isBurst) {
    // 爆发：从中心发射
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 8 + 4;
    return {
      x: canvas.width / 2,
      y: canvas.height / 2 - 50,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 5,
      size: Math.random() * 6 + 3,
      color, shape,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.3,
      life: 1
    };
  } else {
    // 持续：从顶部掉落
    return {
      x: Math.random() * canvas.width,
      y: -20,
      vx: (Math.random() - 0.5) * 3,
      vy: Math.random() * 3 + 2,
      size: Math.random() * 5 + 2,
      color, shape,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.2,
      life: 1
    };
  }
}

function stopConfetti() {
  if (confettiAnimId) {
    cancelAnimationFrame(confettiAnimId);
    confettiAnimId = null;
  }
  confettiParticles = [];
  const canvas = document.getElementById('confettiCanvas');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

function updateStatusBar() {
  if (!currentData) return;
  document.getElementById('statusBar').textContent = 
    `已戳开 ${currentData.opened.filter(x=>x).length} / ${currentData.rows * currentData.cols} 个`;
}

// ====== 初始化 ======
async function init() {
  currentData = getDefaultData();
  renderGrid();
  document.getElementById('statusBar').innerHTML = '<span class="loading"></span>加载中...';
  
  try {
    const data = await readData();
    currentData = data;
    renderGrid();
    updateStatusBar();
  } catch (e) {
    document.getElementById('statusBar').textContent = '使用本地数据';
  }
}

// 窗口大小改变时重新计算
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(updateGridSize, 100);
});

// 字体加载完成后重新计算
document.fonts && document.fonts.ready && document.fonts.ready.then(() => {
  updateGridSize();
});

// 点击弹窗外部关闭
document.querySelectorAll('.modal').forEach(modal => {
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.classList.remove('show');
  });
});

// 回车键登录
document.getElementById('adminPwd').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') adminLogin();
});
document.getElementById('codeInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') submitCode();
});

init();
</script>
